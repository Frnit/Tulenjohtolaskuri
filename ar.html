<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TJ-Laskuri AR v2</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: #0f0; touch-action: none; }
        
        /* Video Container */
        #camContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        /* HUD UI */
        #uiLayer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* HUD Top: Sensors */
        .hud-top { background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); padding: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .sensor-data { font-size: 0.9rem; font-weight: bold; text-shadow: 0 1px 2px #000; }
        .sensor-val { color: #fff; }
        
        /* Controls Top */
        select, button { background: rgba(0,20,0,0.8); color: #0f0; border: 1px solid #0f0; padding: 8px; border-radius: 4px; font-family: inherit; font-weight: bold; }
        .back-btn { background: #c0392b; color: #fff; border: 1px solid #fff; }

        /* Bracketing Box */
        .hud-center { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        #bracketBox {
            border: 2px solid #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            width: 50%; height: 50%; position: absolute;
            transition: width 0.05s, height 0.05s;
        }
        #bracketBox::after { content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-size: 20px; }
        #bracketBox::before { 
            content: attr(data-tgt); position: absolute; top: -20px; left: 0; width:100%; 
            text-align:center; font-size: 0.8rem; text-shadow: 0 1px 2px #000; color: #fff; 
        }

        /* Result Area */
        .result-display { position: absolute; bottom: 25%; width: 100%; text-align: center; text-shadow: 0 2px 4px #000; pointer-events: auto; }
        .dist-val { font-size: 3.5rem; font-weight: bold; color: #0f0; }
        .dist-unit { font-size: 1rem; color: #ccc; }
        
        /* Big Action Button */
        .use-btn {
            background: rgba(0, 255, 0, 0.2); border: 2px solid #0f0; color: #fff;
            padding: 10px 25px; margin-top: 10px; font-size: 1.1rem; border-radius: 30px;
            cursor: pointer; text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); } }

        /* Bottom Controls */
        .controls { background: rgba(0,0,0,0.7); padding: 15px; pointer-events: auto; border-top: 1px solid #0f0; }
        input[type=range] { width: 100%; margin: 10px 0; accent-color: #0f0; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-top: 5px; }
        .act-btn { padding: 8px 15px; border-radius: 4px; border: 1px solid #555; background: #222; color: #ccc; cursor: pointer; }
        .act-btn.active { background: #0f0; color: #000; }

        /* Modal */
        #calibModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; box-sizing: border-box; pointer-events: auto;}
        .modal-content { color: #fff; text-align: center; margin-top: 20%; font-family: sans-serif; }
        .modal-content input { padding: 10px; width: 80px; text-align: center; font-size: 1.2rem; margin: 10px; background: #333; color: #fff; border: 1px solid #555; }
        .persistence-warning { position: fixed; top: 60px; left: 10px; right: 10px; z-index: 30; padding: 8px; border: 1px solid #f39c12; border-radius: 4px; background: rgba(58,43,18,0.95); color: #ffd27f; font: 0.75rem sans-serif; pointer-events: auto; }
        .sensor-status { position: fixed; top: 105px; left: 10px; right: 10px; z-index: 30; padding: 8px; border: 1px solid #f39c12; border-radius: 4px; background: rgba(58,43,18,0.95); color: #ffd27f; font: 0.75rem sans-serif; pointer-events: auto; }
        .pwa-status { position: fixed; top: 72px; left: 50%; z-index: 40; transform: translateX(-50%); padding: 5px 7px; border: 1px solid #496849; border-radius: 4px; background: rgba(0,20,0,0.92); color: #b8e8b8; font: 0.64rem sans-serif; white-space: nowrap; pointer-events: auto; }
        .pwa-update-btn { margin-left: 5px; padding: 3px 5px; border-color: #ffd27f; background: #302410; color: #ffd27f; font-size: 0.64rem; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="camContainer"><video id="video" autoplay playsinline></video></div>
<div id="persistenceWarnings" class="persistence-warning hidden" role="status"></div>
<div id="sensorStatus" class="sensor-status hidden" role="status"></div>
<div class="pwa-status" role="status">
    <span id="pwaStatusText">OFFLINE: TARKISTETAAN</span>
    <button id="pwaUpdateButton" class="pwa-update-btn" type="button" hidden>OTA KÄYTTÖÖN</button>
</div>

<div id="uiLayer">
    <div class="hud-top">
        <div>
            <button class="back-btn" onclick="location.href='index.html'">⬅ POISTU</button>
        </div>
        <div class="sensor-data" style="text-align:right;">
            <div>SUUNTA: <span id="hudAz" class="sensor-val">---</span> MIL</div>
            <div style="font-size:0.7rem; color:#aaa;" id="hudGps">GPS: ODOTTAA...</div>
            <div style="font-size:0.7rem; color:#aaa;" id="fovDisplay">FOV: --°</div>
        </div>
    </div>

    <div class="hud-center">
        <div id="bracketBox" data-tgt="MAALI"></div>
    </div>

    <div class="result-display">
        <div class="dist-val" id="distOutput">---</div>
        <div class="dist-unit">METRIÄ</div>
        <button class="use-btn" onclick="useResult()">✅ KÄYTÄ & PALAA</button>
    </div>

    <div class="controls">
        <div style="display:flex; gap:10px; margin-bottom:5px;">
            <select id="targetSelect" onchange="updateTarget()" style="flex:1;"></select>
            <button onclick="openCalib()">⚙</button>
        </div>
        
        <input type="range" id="sizeSlider" min="10" max="900" value="300" oninput="updateBox()">
        
        <div class="action-row">
            <button class="act-btn" id="btnSensors" onclick="startArSensors(true)">KÄYNNISTÄ SENSORIT</button>
            <button class="act-btn" id="btnFreeze" onclick="toggleFreeze()">❄️ JÄÄDYTÄ</button>
        </div>
    </div>
</div>

<div id="calibModal">
    <div class="modal-content">
        <h2>Kalibrointi</h2>
        <p>1. Aseta tunnettu kohde tasan <strong>5 metrin</strong> päähän.</p>
        <p>2. Säädä vihreä laatikko kohteen kokoiseksi.</p>
        <p>3. Syötä kohteen tiedot:</p>
        <input type="number" id="calDist" value="5" placeholder="Etäisyys"> m <br>
        <input type="number" id="calWidth" value="2.0" placeholder="Leveys"> m <br>
        <br>
        <button class="act-btn active" onclick="saveCalibration()">TALLENNA</button>
        <button class="act-btn" onclick="document.getElementById('calibModal').style.display='none'">PERUUTA</button>
    </div>
</div>

<script src="src/adapters/storage.js"></script>
<script src="src/persistence/repository.js"></script>
<script src="src/app/errors.js"></script>
<script src="src/adapters/geolocation.js"></script>
<script src="src/adapters/orientation.js"></script>
<script src="src/adapters/camera.js"></script>
<script src="src/app/state.js"></script>
<script src="src/ui/safe-dom.js"></script>
<script src="src/pwa/release.js"></script>
<script src="src/pwa/client.js"></script>
<script>
    // --- STATE ---
    const defaultTargets = [{n:"Mies (0.5m)",s:0.5}, {n:"Mies (1.8m)",s:1.8}, {n:"BTR (2.9m)",s:2.9}, {n:"Auto (1.8m)",s:1.8}];
    const persistenceRepository = TJL.createPersistenceRepository({
        local: TJL.createStorageAdapter(() => window.localStorage),
        session: TJL.createStorageAdapter(() => window.sessionStorage)
    });
    const appState = TJL.createAppState(persistenceRepository.loadAll({targets: defaultTargets}));
    const cameraAdapter = TJL.createCameraAdapter({video: document.getElementById('video')});
    const geolocationAdapter = TJL.createGeolocationAdapter();
    const orientationAdapter = TJL.createOrientationAdapter();
    const pwaClient = TJL.createPwaClient();
    TJL.bindPwaStatus(pwaClient, {
        statusElement: document.getElementById('pwaStatusText'),
        updateButton: document.getElementById('pwaUpdateButton')
    });
    pwaClient.register();
    let targetSize = 2.3; 
    let fovDeg = Number(appState.settings.arFov) || 70.0;
    let isFrozen = false;
    let currentDist = 0;

    // --- INIT ---
    window.onload = function() {
        startArSensors(false);
        loadTargets();
        renderPersistenceWarnings();
        updateFovDisplay();
        updateBox();
    };

    // --- SHARED LIBRARY LOGIC ---
    function renderPersistenceWarnings() {
        const warnings = persistenceRepository.warnings();
        appState.persistence.warnings = warnings;
        appState.persistence.status = warnings.length ? 'warning' : 'ready';
        const element = document.getElementById('persistenceWarnings');
        if (!warnings.length) {
            TJL.safeDom.setText(element, '');
            element.classList.add('hidden');
            return;
        }
        TJL.safeDom.setText(element, warnings.map(warning => `${warning.key}: ${warning.message}`).join(' '));
        element.classList.remove('hidden');
    }

    function loadTargets() {
        const targets = appState.targets;
        
        const sel = document.getElementById('targetSelect');
        TJL.safeDom.empty(sel);
        targets.forEach(t => {
            TJL.safeDom.appendOption(sel, {value: t.s, text: `${t.n} (${t.s}m)`});
        });
        
        if (!sel.options.length) {
            TJL.safeDom.appendOption(sel, {value: '', text: 'Ei tallennettuja kohteita', disabled: true, selected: true});
            targetSize = 0;
            document.getElementById('bracketBox').setAttribute('data-tgt', 'EI KOHDETTA');
            calculate();
            return;
        }

        // Set default to BTR-like size if possible
        if(sel.options.length > 2) sel.selectedIndex = 2;
        updateTarget();
    }

    // --- CAMERA & SENSORS ---
    function renderArSensorStatus() {
        const states = appState.sensors;
        const notices = [];
        if (states.camera.status === 'error') notices.push('Kamera ei ole käytettävissä.');
        if (states.geolocation.status === 'error') notices.push('GPS ei ole käytettävissä.');
        if (states.orientation.permission === 'prompt') notices.push('Suunta-anturi vaatii käynnistyspainikkeen.');
        else if (states.orientation.status === 'error') notices.push('Suunta-anturi ei ole käytettävissä.');

        const element = document.getElementById('sensorStatus');
        TJL.safeDom.setText(element, notices.join(' ') + (notices.length ? ' Manuaalinen laskenta toimii pääsivulla.' : ''));
        element.classList.toggle('hidden', notices.length === 0);

        const allActive = states.camera.status === 'active' &&
            states.geolocation.status === 'active' &&
            states.orientation.status === 'active';
        TJL.safeDom.setText('btnSensors', allActive ? 'SENSORIT KÄYTÖSSÄ' : 'KÄYNNISTÄ SENSORIT');
    }

    cameraAdapter.subscribe(state => {
        appState.sensors.camera = state;
        renderArSensorStatus();
    });

    geolocationAdapter.subscribe(state => {
        appState.sensors.geolocation = state;
        if (state.value) TJL.safeDom.setText('hudGps', `${state.value.latitude.toFixed(4)}, ${state.value.longitude.toFixed(4)}`);
        else if (state.status === 'error') TJL.safeDom.setText('hudGps', 'GPS: EI KÄYTÖSSÄ');
        else TJL.safeDom.setText('hudGps', 'GPS: ODOTTAA...');
        renderArSensorStatus();
    });

    orientationAdapter.subscribe(state => {
        appState.sensors.orientation = state;
        if (state.value) TJL.safeDom.setText('hudAz', Math.round(state.value.headingDegrees * (6400 / 360)));
        else TJL.safeDom.setText('hudAz', '---');
        renderArSensorStatus();
    });

    async function startArSensors(requestPermission) {
        await Promise.all([
            cameraAdapter.start(),
            geolocationAdapter.start(),
            orientationAdapter.start({requestPermission: Boolean(requestPermission)})
        ]);
        renderArSensorStatus();
    }

    async function toggleFreeze() {
        const b = document.getElementById('btnFreeze');
        const result = await cameraAdapter.freeze(!isFrozen);
        if (!result.ok) return;
        isFrozen = !isFrozen;
        b.classList.toggle('active', isFrozen);
        TJL.safeDom.setText(b, isFrozen ? '▶ JATKA' : '❄️ JÄÄDYTÄ');
    }

    // --- CALCULATION ---
    function updateTarget() {
        const sel = document.getElementById('targetSelect');
        if (sel.selectedIndex < 0 || !sel.options[sel.selectedIndex].value) {
            targetSize = 0;
            document.getElementById('bracketBox').setAttribute('data-tgt', 'EI KOHDETTA');
            calculate();
            return;
        }
        targetSize = parseFloat(sel.value);
        document.getElementById('bracketBox').setAttribute('data-tgt', sel.options[sel.selectedIndex].text);
        calculate();
    }

    function updateBox() {
        const px = document.getElementById('sizeSlider').value;
        const b = document.getElementById('bracketBox');
        b.style.width = px + 'px';
        b.style.height = (px * 0.7) + 'px';
        calculate();
    }

    function calculate() {
        const boxPx = parseInt(document.getElementById('sizeSlider').value);
        const screenPx = window.innerWidth;
        const fovRad = fovDeg * (Math.PI / 180);
        const objAngle = (boxPx / screenPx) * fovRad;
        
        currentDist = Math.round((targetSize / 2) / Math.tan(objAngle / 2));
        document.getElementById('distOutput').innerText = currentDist;
    }

    // --- LOOP-BACK TO INDEX ---
    function useResult() {
        if(currentDist > 0) {
            // Save to shared storage
            const result = persistenceRepository.writeLegacyIncomingDistance(currentDist);
            if (!result.ok) {
                renderPersistenceWarnings();
                return;
            }
            // Go back
            location.href = 'index.html';
        } else {
            alert("Mittaa ensin etäisyys.");
        }
    }

    // --- CALIBRATION ---
    function openCalib() { document.getElementById('calibModal').style.display='block'; }
    function saveCalibration() {
        const d = parseFloat(document.getElementById('calDist').value);
        const w = parseFloat(document.getElementById('calWidth').value);
        const px = parseInt(document.getElementById('sizeSlider').value);
        if(!d||!w) return;
        
        const angle = 2 * Math.atan((w/2)/d);
        const newFov = (angle / (px / window.innerWidth)) * (180/Math.PI);
        
        const nextSettings = Object.assign({}, appState.settings, {arFov: Number(newFov.toFixed(2))});
        if (!persistenceRepository.saveSettings(nextSettings).ok) {
            renderPersistenceWarnings();
            return;
        }
        appState.settings = nextSettings;
        fovDeg = newFov;
        updateFovDisplay();
        document.getElementById('calibModal').style.display='none';
        calculate();
    }
    function updateFovDisplay() { document.getElementById('fovDisplay').innerText = "FOV: " + fovDeg.toFixed(1) + "°"; }

</script>
</body>
</html>
